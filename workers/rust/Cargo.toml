[package]
name = "optopus-studio-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The Rust side of optopus studio's worker protocol: a ported model links this and becomes a solver worker"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The core optopus-py vendors, so a Rust worker runs the same search as the Python one it
# replaces (docs/adr/0002, docs/adr/0005).
optopus = { path = "../../../optopus-py/vendor/optopus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
