[package]
name = "optopus-studio-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The Rust side of optopus studio's worker protocol: a ported model links this and becomes a solver worker"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The core the optopus-py commit in ../../pyproject.toml vendors (its vendor/optopus), so a Rust
# worker runs the same search as the Python one it replaces. Move both together (docs/adr/0008).
optopus = { git = "https://github.com/trash-iine/optopus", rev = "594f4735658589ac2b366a147f45bc6395dfafb6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
