[project]
name = "optopus-studio"
version = "0.1.0"
description = "Chat-driven optimization studio: an agent models and solves with optopus, and a canvas shows the result"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "Trash-iine" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "openpyxl>=3.1.5",
    "optopus",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
optopus-studio = "optopus_studio.cli:main"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.4", "ruff>=0.14"]
# The agent, which only the studio runs. A packaged app's image leaves it out (docs/adr/0010).
studio = ["claude-agent-sdk>=0.2.165"]

[tool.uv]
default-groups = ["dev", "studio"]

[tool.uv.sources]
# Built from a commit of optopus-py's main until a release carries RunResult.trajectory and
# on_improvement. workers/rust/Cargo.toml pins the core that commit vendors. See docs/adr/0008.
optopus = { git = "https://github.com/trash-iine/optopus-py", rev = "fee315d1c9342d5fe8763753c2e7894aed2fb915" }

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["optopus_studio"]
known-third-party = ["optopus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that read from GitHub or build Docker images run only when asked for:
# uv run pytest -m network, uv run pytest -m docker
addopts = "-m 'not network and not docker'"
markers = ["network: reads from GitHub", "docker: builds and runs an app's image"]
# A test still running after this long has its threads' stacks printed, to show where it hangs.
faulthandler_timeout = 180
