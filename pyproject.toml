[project]
name = "optopus-studio"
version = "0.1.0"
description = "Chat-driven optimization studio: an agent models and solves with optopus, and a canvas shows the result"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "Trash-iine" }]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.143.0",
    "openpyxl>=3.1.5",
    "optopus",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
optopus-studio = "optopus_studio.cli:main"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.4", "ruff>=0.14"]

[tool.uv.sources]
# RunResult.trajectory is not released yet (trash-iine/optopus-py#33); build the sibling
# checkout until a tag carries it. See docs/adr/0002.
optopus = { path = "../optopus-py" }

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["optopus_studio"]
known-third-party = ["optopus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
